name: Build Fastkeyx Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/Fastkeyx.iss"
      - "public/Fastkeyx.exe"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          Write-Host 'Downloading Inno Setup 7.1.0...'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          Write-Host "Installing Inno Setup to $installDir..."
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $installDir 'ISCC.exe'))) { throw "ISCC.exe was not found in $installDir after installation." }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup7\ISCC.exe'
          & $iscc 'installer\Fastkeyx.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          if (-not (Test-Path 'public\Fastkeyx-Setup.exe')) { throw 'Installer output was not created.' }

      - name: Commit installer to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Fastkeyx-Setup.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: publish Fastkeyx installer"
            git push
          } else {
            Write-Host "Installer is already up to date."
          }
